name: Daily compliance report
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # tous les jours 10:00 UTC+2 (Paris)
permissions:
  contents: read
jobs:
  compliance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-first-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-first-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate compliance report
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p reports
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { evaluateCompliance, renderComplianceReport } from './src/compliance.js';

          const packageJson = JSON.parse(fs.readFileSync(path.resolve('package.json'), 'utf8'));
          const hasPackageLock = fs.existsSync(path.resolve('package-lock.json'));
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const report = evaluateCompliance(packageJson, hasPackageLock);
          const markdown = renderComplianceReport(report, {
            owner,
            repo,
            sha: process.env.GITHUB_SHA,
          });

          fs.writeFileSync(path.resolve('reports/report.md'), `${markdown}\n`);
          NODE

      - name: Publish report in job summary
        run: cat reports/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Archive report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: my-first-app/reports/report.md